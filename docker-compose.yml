services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    restart: unless-stopped
    environment:
      - LITESTAR_APP=sticky.app:app
    command: sh -c "uv run task pre_deploy && uv run litestar run --host 0.0.0.0 --port 8000"
    volumes:
      - generations:/app/generations
    env_file:
      - .env
    networks:
      - dokploy-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - ${STICKY_REDIS_PORT}
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=${STICKY_POSTGRES_DATABASE}
      - POSTGRES_USER=${STICKY_POSTGRES_USER}
      - POSTGRES_PASSWORD=${STICKY_POSTGRES_PWD}
      - PGPORT=${STICKY_POSTGRES_PORT}
    ports:
      - ${STICKY_POSTGRES_PORT}
    volumes:
      - sticky_db_data:/var/lib/postgresql/data
    networks:
      - dokploy-network

volumes:
  generations:
  sticky_db_data:
  redis_data:

networks:
  dokploy-network:
    external: true
