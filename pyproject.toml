[project]
name = "gift-sticky"
version = "0.1.0"
description = "Telegram gifts price and price changes sticker pack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.31.0",
  "aiohttp>=3.14.3",
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "cairosvg>=2.9.1",
  "gchanges",
  "litestar>=2.24.0",
  "pillow>=12.3.0",
  "psycopg2-binary>=2.9.13",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.0.52",
  "sqlalchemy-utils>=0.42.1",
  "structlog>=26.1.0",
  "taskipy>=1.14.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.16.7",
]

[tool.taskipy.tasks]
main = { cmd = "uv run -m sticky", help = "Main process worker" }
generate = { cmd = "uv run -m sticky --generate", help = "Generate stickers" }

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
extend-select = [
  "I",
  "UP",
  "T20",
  "B039",
  "PT",
  "RUF022",
  "RUF023",
  "RUF10",  # RUF10x
  "RUF20",  # RUF20x
  "ARG",
]
ignore = ["F841", 'B008']

[tool.ruff.lint.per-file-ignores]
"migrations/*" = [
  "F401", # remove unusud import
]


[tool.uv.sources]
gchanges = { path = "../gift-changes-python", editable = true }

[tool.pyright]
venvPath = ".venv"
venv = "."
